<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1296 266" width="1296" height="266" role="img" aria-label="Results: fraud losses down 18% in the first quarter after launch of Ally Financial&#x27;s real-time fraud scoring; average fraud-API response time from 340 to 265 ms after reworking query plans and adding connection pooling; pytest-triage&#x27;s LLM labels beat the best free method by 0.095 macro-F1 (95% CI +0.04 to +0.14).">
