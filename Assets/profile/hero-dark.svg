<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1296 496" width="1296" height="496" role="img" aria-label="Shashank Yadav, AI/ML engineer. Open to AI/ML engineer roles. Builds LLM features, retrieval systems and evals, and the backend services they run on. MS in Computer Science, UMass Boston, 2025. Based in Denver, CO, open to relocation. Current role: Software Developer at Ally Financial.">
<title>Shashank Yadav, AI/ML engineer. Open to AI/ML engineer roles. Builds LLM features, retrieval systems and evals, and the backend services they run on. MS in Computer Science, UMass Boston, 2025. Based in Denver, CO, open to relocation. Current role: Software Developer at Ally Financial.</title>
<style>
  .ph{display:none}
  @media (max-width: 600px){ .dt{display:none} .ph{display:inline} }

  .pkt{animation:travel 4.0s linear infinite}
  @keyframes travel{
    0%{transform:translateY(0);opacity:0} 3%{opacity:1}
    65%{transform:translateY(138px);opacity:1}
    73%,100%{transform:translateY(138px);opacity:0} }
  .node{animation:lit 4.0s linear infinite}
  @keyframes lit{ 0%{fill:#4493f8} 12%,100%{fill:#161b22} }
  .cur{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{ 50%{opacity:0} }
  .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
  @keyframes ping{ 0%{transform:scale(1);opacity:.8} 100%{transform:scale(3);opacity:0} }
  .rot{opacity:0;animation:rot 14.0s ease-in-out infinite backwards}
  @keyframes rot{
    0%{opacity:0;transform:translateY(7px)} 3.0%{opacity:1;transform:none}
    22.0%{opacity:1;transform:none} 25.0%,100%{opacity:0;transform:translateY(-7px)} }
  @media (prefers-reduced-motion: reduce){ .pkt,.node,.cur,.ping,.rot{animation:none} .pkt,.ping{opacity:0} .rot0{opacity:1} }

  .leg{transform-box:fill-box;transform-origin:50% 0}
  .walk{animation:bob .32s ease-in-out infinite alternate}
  .walk .leg{animation:leg .32s ease-in-out infinite alternate}
  .walk .leg2{animation-delay:-.32s}
  @keyframes leg{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
  @keyframes bob{to{transform:translateY(-1.6px)}}
  .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .ant{animation:ant 1.6s ease-in-out infinite}
  @keyframes ant{50%{opacity:.3}}
  @media (prefers-reduced-motion: reduce){ .bot{display:none} }
</style>
