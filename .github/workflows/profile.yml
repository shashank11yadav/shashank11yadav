# Refreshes the moving parts of the profile README:
#   - hero-{light,dark}.svg with the current profile-view count (read from the komarev.com
#     counter that the README loads as a 1x1 image; each refresh adds one view)
#   - activity-{light,dark}.svg, the contribution field (last 12 months, one cell per day)
# Both images go to the `output` branch, so they don't add commits to `master`.
#   - the Open-source contributions table, which has to stay text for its links to work, so
#     it is committed to `master`, and only when a PR or issue changed (scripts/upstream.py)
name: profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render the banner and the contribution field
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          views=$(curl -fsS "https://komarev.com/ghpvc/?username=${{ github.repository_owner }}" | python3 scripts/views.py) || views=""
          python3 scripts/contributions.py "${{ github.repository_owner }}" > "$RUNNER_TEMP/contributions.json"
          python3 scripts/render_svgs.py dist --only hero,activity --contrib "$RUNNER_TEMP/contributions.json" ${views:+--views "$views"}

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upstream:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refresh the open-source contributions table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/upstream.py "${{ github.repository_owner }}"
          python3 scripts/build_readme.py

      - name: Commit it if something changed
        run: |
          if git diff --quiet -- README.md scripts/upstream.data.json; then
            echo "No change."
            exit 0
          fi
          git -c user.name="Shashank Yadav" -c user.email=65058495+shashank11yadav@users.noreply.github.com \
            commit -m "Update open-source contributions" -- README.md scripts/upstream.data.json
          git push origin HEAD:master
